[package]
name = "website"
version = "0.1.0"
edition = "2024"
authors = ["Hussard Group"]
description = "Hussard - Premium landing page. Full Rust / WASM."

[dependencies]
leptos = { version = "0.8.19", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "DomTokenList",
    "Element",
    "Window",
    "Document",
]

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
